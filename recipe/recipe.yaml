context:
  name: pyathena
  version: "4.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyathena-${{ version }}.tar.gz
  sha256: 9028705110b757e198363fc1bf9111be1e323e3cf87c657eeee6cf5250ae636c

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - boto3 >=1.43.31
    - botocore >=1.43.31
    - tenacity >=8.0.1
    - fsspec >=2026.9.0
    - python-tzdata >=2024.2
tests:
  - python:
      imports:
        - pyathena
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://github.com/pyathena-dev/PyAthena
  license: MIT
  license_file: LICENSE
  summary: Python DB API 2.0 (PEP 249) compliant client for Amazon Athena
  repository: https://github.com/pyathena-dev/PyAthena
  documentation: https://pyathena.dev/

extra:
  recipe-maintainers:
    - xylar
    - JorgeGarciaIrazabal
    - mariusvniekerk
