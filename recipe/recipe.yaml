context:
  name: pyathena
  version: "3.38.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyathena-${{ version }}.tar.gz
  sha256: 55d81a4cbc3229bad3f2e3e30a243616a8626c994f4c3a864f61f7930f997589

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - boto3 >=1.41.2
    - botocore >=1.41.2
    - tenacity >=4.1.0
    - fsspec
    - python-dateutil
tests:
  - python:
      imports:
        - pyathena
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pyathena-dev/PyAthena
  license: MIT
  license_file: LICENSE
  summary: Python DB API 2.0 (PEP 249) compliant client for Amazon Athena
  repository: https://github.com/pyathena-dev/PyAthena
  documentation: https://pyathena.dev/

extra:
  recipe-maintainers:
    - xylar
    - JorgeGarciaIrazabal
    - mariusvniekerk
